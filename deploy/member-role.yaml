AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ZeroDock's dedicated read-only member-account role. This intentionally uses
  AWS SecurityAudit and is not OrganizationAccountAccessRole, which carries
  administrative access that the scanner neither needs nor should request.

Parameters:
  ScannerAccountId:
    Type: String
    Description: AWS account ID whose scanner role may assume this role.
    AllowedPattern: "^[0-9]{12}$"

Resources:
  ZeroDockScannerMemberRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ZeroDockScannerMemberRole
      Description: Read-only role assumed by the ZeroDock scanner enclave.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TrustZeroDockScannerAccount
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${ScannerAccountId}:root"
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/SecurityAudit"

Outputs:
  MemberRoleArn:
    Description: Role ARN the scanner assumes in this member account.
    Value: !GetAtt ZeroDockScannerMemberRole.Arn
